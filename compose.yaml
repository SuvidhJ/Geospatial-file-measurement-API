# Full stack: API, Redis-backed job queue and a processing worker sharing one data volume.
#   docker compose up --build
services:
  api:
    build: .
    image: geospatial-measurement-api
    ports:
      - "8000:8000"
    volumes:
      - geoapi-data:/data
    environment:
      GEOAPI_REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    image: geospatial-measurement-api
    command: ["rq", "worker", "file-processing", "--url", "redis://redis:6379/0"]
    volumes:
      - geoapi-data:/data
    environment:
      GEOAPI_REDIS_URL: redis://redis:6379/0
    depends_on:
      # The API applies database migrations on startup; wait for it before taking jobs.
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      disable: true
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  geoapi-data:
