name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, type-check and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: make lint
      - run: make typecheck
      - run: make test

  stack:
    name: Docker stack smoke test
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - name: Start API, Redis and worker
        run: docker compose up -d --build --wait api redis
      - run: docker compose up -d worker
      - name: Synchronous upload
        run: curl -sf -F "file=@sample_data/bengaluru_survey.kml" http://localhost:8000/api/files/
      - name: Queued upload is completed by the worker
        run: |
          id=$(curl -sf -F "file=@sample_data/bengaluru_parcels.zip" \
            "http://localhost:8000/api/files/?wait=false" | jq -r .id)
          for i in $(seq 1 30); do
            status=$(curl -sf "http://localhost:8000/api/files/$id/" | jq -r .status)
            echo "status: $status"
            [ "$status" = "COMPLETED" ] && exit 0
            sleep 1
          done
          docker compose logs worker
          exit 1
      - if: always()
        run: docker compose down -v
