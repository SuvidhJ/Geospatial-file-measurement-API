[project]
name = "geospatial-file-measurement-api"
version = "1.0.0"
description = "Upload a Shapefile, KML or KMZ and get CRS-correct area, length and DEM volume measurements per feature."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
keywords = ["gis", "geospatial", "shapefile", "kml", "crs", "fastapi", "stockpile", "volume"]
classifiers = [
    "Framework :: FastAPI",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: GIS",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    # Raised inside rasterio's own affine arithmetic; not actionable from this codebase.
    "ignore:Use `@` matmul:PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
fail_under = 95
show_missing = true

[tool.mypy]
python_version = "3.11"
files = ["app"]
strict_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
# geopandas, pyogrio, shapely and defusedxml ship without complete type stubs.
ignore_missing_imports = true
